# Low-memory friendly (Kotlin daemon fails when host RAM is exhausted)
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true
# Avoid a separate Kotlin daemon process (common failure under RAM pressure)
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
